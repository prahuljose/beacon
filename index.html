<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0E1A">
  <title>Beacon · Solar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:        '#0A0E1A',
            card:      '#141927',
            cardAlt:   '#1A2235',
            divider:   '#1E2D45',
            accent:    '#F59E0B',
            accentDk:  '#D97706',
            green:     '#10B981',
            red:       '#EF4444',
            textPrim:  '#FFFFFF',
            textSec:   '#8B9CB5',
          },
          fontFamily: {
            sans: ['Outfit', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #0A0E1A; }
    body { font-family: 'Outfit', system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    /* Subtle pulsing dot for the "live" indicator */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.92); }
    }
    .pulse-dot { animation: pulse-soft 1.6s ease-in-out infinite; }

    /* Glow behind the live-output icon */
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 24px 6px rgba(245, 158, 11, 0.20); }
      50%      { box-shadow: 0 0 40px 14px rgba(245, 158, 11, 0.35); }
    }
    .icon-glow { animation: glow 2.2s ease-in-out infinite; }

    /* Soft fade-in for the staggered card entrance */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .stagger > * { opacity: 0; animation: fade-up 0.5s ease-out forwards; }
    .stagger > *:nth-child(1) { animation-delay: 0.00s; }
    .stagger > *:nth-child(2) { animation-delay: 0.06s; }
    .stagger > *:nth-child(3) { animation-delay: 0.12s; }
    .stagger > *:nth-child(4) { animation-delay: 0.18s; }
    .stagger > *:nth-child(5) { animation-delay: 0.24s; }
  </style>
</head>
<body class="bg-bg text-textPrim min-h-screen antialiased">
  <div class="mx-auto max-w-3xl px-5 sm:px-7 py-8 sm:py-10">

    <!-- ─── Header ─────────────────────────────────────────────────────── -->
    <header class="flex items-end justify-between mb-7">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-accent" fill="currentColor">
            <circle cx="12" cy="12" r="4.5"/>
            <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="2"  x2="12" y2="4.5"/>
              <line x1="12" y1="19.5" x2="12" y2="22"/>
              <line x1="2"  y1="12" x2="4.5" y2="12"/>
              <line x1="19.5" y1="12" x2="22" y2="12"/>
              <line x1="4.93"  y1="4.93"  x2="6.7"  y2="6.7"/>
              <line x1="17.3"  y1="17.3"  x2="19.07" y2="19.07"/>
              <line x1="4.93"  y1="19.07" x2="6.7"  y2="17.3"/>
              <line x1="17.3"  y1="6.7"   x2="19.07" y2="4.93"/>
            </g>
          </svg>
          <span class="text-xs tracking-widest text-textSec uppercase">Beacon</span>
        </div>
        <h1 id="stationName" class="text-xl sm:text-2xl font-bold leading-tight">—</h1>
        <p id="stationAddress" class="text-xs text-textSec mt-0.5">—</p>
      </div>
      <div class="text-right">
        <div id="statusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium border border-divider text-textSec">
          <span class="w-1.5 h-1.5 rounded-full bg-textSec"></span>
          <span>Loading…</span>
        </div>
        <p id="lastRefreshed" class="text-[10px] text-textSec mt-1.5">—</p>
      </div>
    </header>

    <!-- ─── Content ────────────────────────────────────────────────────── -->
    <main class="stagger space-y-5">

      <!-- Live Output -->
      <section class="rounded-3xl p-7 border border-divider"
               style="background: linear-gradient(135deg, #78350F 0%, #0D1117 100%);">
        <div class="flex items-center justify-between mb-5">
          <span class="text-xs text-textSec">Live Output</span>
          <div id="liveBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium border" style="border-color: rgba(16,185,129,0.35); background: rgba(16,185,129,0.12); color:#10B981">
            <span class="pulse-dot w-1.5 h-1.5 rounded-full bg-green"></span>
            <span>Live</span>
          </div>
        </div>

        <div class="flex flex-col items-center my-3">
          <div id="liveIcon" class="icon-glow w-16 h-16 rounded-full flex items-center justify-center mb-5"
               style="background: rgba(245,158,11,0.12);">
            <svg viewBox="0 0 24 24" class="w-9 h-9 text-accent" fill="currentColor">
              <circle cx="12" cy="12" r="4.5"/>
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="2.5"  x2="12" y2="5"/>
                <line x1="12" y1="19"   x2="12" y2="21.5"/>
                <line x1="2.5"  y1="12" x2="5"  y2="12"/>
                <line x1="19"   y1="12" x2="21.5" y2="12"/>
                <line x1="5.2"  y1="5.2"  x2="6.9"  y2="6.9"/>
                <line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/>
                <line x1="5.2"  y1="18.8" x2="6.9"  y2="17.1"/>
                <line x1="17.1" y1="6.9"  x2="18.8" y2="5.2"/>
              </g>
            </svg>
          </div>
          <div id="liveWatts" class="num text-5xl sm:text-6xl font-bold text-accent">— W</div>
          <p id="liveCaption" class="text-xs text-textSec mt-1.5">—</p>
        </div>

        <!-- Capacity bar -->
        <div class="mt-4">
          <div class="flex justify-between text-[11px] mb-1.5">
            <span class="text-textSec">Capacity used</span>
            <span id="capacityPct" class="text-accent font-semibold">—</span>
          </div>
          <div class="h-1.5 bg-divider rounded-full overflow-hidden">
            <div id="capacityBar" class="h-full bg-accent rounded-full transition-all duration-700 ease-out" style="width:0%"></div>
          </div>
        </div>
      </section>

      <!-- KPI grid -->
      <section class="grid grid-cols-3 gap-3">
        <div class="rounded-2xl p-4 bg-card border border-divider text-center">
          <div class="mx-auto mb-3 w-7 h-7 rounded-lg flex items-center justify-center" style="background: rgba(245,158,11,0.15);">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>
            </svg>
          </div>
          <div id="kpiToday" class="num text-xl font-bold">—</div>
          <div class="text-[11px] text-accent font-medium mt-0.5">kWh</div>
          <div class="text-[11px] text-textSec mt-0.5">Today</div>
        </div>
        <div class="rounded-2xl p-4 bg-card border border-divider text-center">
          <div class="mx-auto mb-3 w-7 h-7 rounded-lg flex items-center justify-center" style="background: rgba(245,158,11,0.15);">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div id="kpiMonth" class="num text-xl font-bold">—</div>
          <div class="text-[11px] text-accent font-medium mt-0.5">kWh</div>
          <div class="text-[11px] text-textSec mt-0.5">This Month</div>
        </div>
        <div class="rounded-2xl p-4 bg-card border border-divider text-center">
          <div class="mx-auto mb-3 w-7 h-7 rounded-lg flex items-center justify-center" style="background: rgba(245,158,11,0.15);">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div id="kpiTotal" class="num text-xl font-bold">—</div>
          <div id="kpiTotalUnit" class="text-[11px] text-accent font-medium mt-0.5">kWh</div>
          <div class="text-[11px] text-textSec mt-0.5">Total</div>
        </div>
      </section>

      <!-- Power curve -->
      <section class="rounded-2xl p-5 bg-card border border-divider">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-sm font-semibold">Today's Power Curve</h2>
            <p class="text-[11px] text-textSec mt-0.5" id="pacSubtitle">—</p>
          </div>
          <div class="flex gap-2">
            <span id="totalBadge" class="hidden text-[10px] font-semibold px-2 py-1 rounded-full" style="background: rgba(16,185,129,0.12); color:#10B981; border:1px solid rgba(16,185,129,0.3);">Total —</span>
            <span id="peakBadge"  class="hidden text-[10px] font-semibold px-2 py-1 rounded-full" style="background: rgba(245,158,11,0.12); color:#F59E0B; border:1px solid rgba(245,158,11,0.3);">Peak —</span>
          </div>
        </div>
        <div class="relative h-52 sm:h-60">
          <canvas id="pacChart"></canvas>
        </div>
      </section>

      <!-- Lifetime impact -->
      <section class="rounded-2xl p-5 bg-card border border-divider">
        <h2 class="text-sm font-semibold mb-1">Lifetime Impact</h2>
        <p class="text-[11px] text-textSec mb-4">What your panels have offset</p>
        <div class="grid grid-cols-3 gap-3">
          <div class="text-center">
            <div id="co2" class="num text-lg font-bold text-green">—</div>
            <div class="text-[10px] text-textSec mt-0.5">tonnes CO₂</div>
          </div>
          <div class="text-center">
            <div id="trees" class="num text-lg font-bold" style="color:#34D399">—</div>
            <div class="text-[10px] text-textSec mt-0.5">trees</div>
          </div>
          <div class="text-center">
            <div id="coal" class="num text-lg font-bold" style="color:#A78BFA">—</div>
            <div class="text-[10px] text-textSec mt-0.5">kg coal</div>
          </div>
        </div>
      </section>

      <footer class="text-center pt-2 pb-2 text-[10px] text-textSec">
        <span id="errorBox" class="hidden text-red"></span>
      </footer>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
