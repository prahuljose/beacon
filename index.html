<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23F59E0B'/></svg>">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1120;
      color: #E5E7EB;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 0 16px;
    }
    .dot {
      width: 14px;
      height: 14px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #F59E0B;
      box-shadow: 0 0 24px 6px rgba(245, 158, 11, .35);
    }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
    p { margin: 8px 0 0; color: #8B9CB5; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>Beacon</h1>
    <p>Something new is on the way.</p>
  </main>
</body>
</html>
